name: Build Headshot Sensitivity APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar arquivos necessarios
        run: |
          test -f index.html
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/headshotsensitivity/MainActivity.java

      - name: Preparar HTML
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Verificar certificado de depuracao
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android
          else
            echo "Nenhuma chave de depuracao preexistente encontrada."
          fi
          
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
     
      - name: Comparar certificados dos APKs
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          echo "=== APK ANTIGO ==="
          "$APK_SIGNER" verify --print-certs old-app-debug.apk

          echo "=== APK NOVO ==="
          "$APK_SIGNER" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk
     
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Headshot-Sensitivity-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
